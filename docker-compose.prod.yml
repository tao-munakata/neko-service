services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - neko-net
      - nyanko-chat_default

  frontend:
    image: ghcr.io/tao-munakata/neko-service-frontend:latest
    env_file: .env.prod
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - neko-net

  backend:
    image: ghcr.io/tao-munakata/neko-service-backend:latest
    env_file: .env.prod
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - neko-net

  postgres:
    image: postgres:16-alpine
    env_file: .env.prod
    environment:
      POSTGRES_USER: neko
      POSTGRES_PASSWORD: neko_Prod_2026!
      POSTGRES_DB: neko_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neko"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - neko-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - neko-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file: .env.prod
    environment:
      MINIO_ROOT_USER: nekoMinioAdmin
      MINIO_ROOT_PASSWORD: MinioNeko_2026!
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - neko-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  neko-net:
    driver: bridge
  nyanko-chat_default:
    external: true
