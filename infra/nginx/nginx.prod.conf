events { worker_connections 1024; }

http {
    client_max_body_size 20M;

    # ── HTTP → HTTPS リダイレクト（Certbot認証パスは除外）─────────
    server {
        listen 80;
        server_name nyanko.fun;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://nyanko.fun$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name nyanko.fun;

        ssl_certificate     /etc/letsencrypt/live/nyanko.fun/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nyanko.fun/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # 既存サービス: /nyanko/* → nyanko_chat コンテナ（内部3001）
        location /nyanko/ {
            proxy_pass         http://nyanko_chat:3000/nyanko/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ねこサービス API
        location /api/ {
            proxy_pass         http://backend:3001/api/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ねこサービス フロントエンド
        location / {
            proxy_pass         http://frontend:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
