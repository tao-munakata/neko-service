<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 白背景 -->
  <rect width="512" height="512" rx="96" fill="white"/>

  <!-- 左耳（外） -->
  <polygon points="105,210 150,70 245,195" fill="#f97316"/>
  <!-- 右耳（外） -->
  <polygon points="407,210 362,70 267,195" fill="#f97316"/>
  <!-- 左耳（内） -->
  <polygon points="128,198 160,102 228,190" fill="#fed7aa"/>
  <!-- 右耳（内） -->
  <polygon points="384,198 352,102 284,190" fill="#fed7aa"/>

  <!-- 顔（オレンジ円） -->
  <circle cx="256" cy="300" r="185" fill="#f97316"/>

  <!-- 左目（にっこり弧） -->
  <path d="M168,268 Q196,242 224,268" stroke="white" stroke-width="11" fill="none" stroke-linecap="round"/>
  <!-- 右目（にっこり弧） -->
  <path d="M288,268 Q316,242 344,268" stroke="white" stroke-width="11" fill="none" stroke-linecap="round"/>

  <!-- 鼻 -->
  <ellipse cx="256" cy="320" rx="14" ry="10" fill="#fed7aa"/>

  <!-- にっこり口 -->
  <path d="M216,344 Q256,382 296,344" stroke="white" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- ひげ左 -->
  <line x1="72" y1="308" x2="210" y2="318" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="72" y1="332" x2="210" y2="332" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- ひげ右 -->
  <line x1="302" y1="318" x2="440" y2="308" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="302" y1="332" x2="440" y2="332" stroke="white" stroke-width="5" stroke-linecap="round"/>
</svg>
