name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /home/ubuntu/nyanko

            # 最新コードを取得（サーバーのローカル変更は破棄）
            git fetch origin main
            git reset --hard origin/main

            # バックエンドをビルド・再起動
            docker compose -f docker-compose.prod.yml -f docker-compose.server-build.yml build backend
            docker compose -f docker-compose.prod.yml -f docker-compose.server-build.yml up -d --no-deps backend

            # フロントエンドをビルド・再起動（メモリ上限付き）
            NODE_OPTIONS="--max-old-space-size=512" \
              docker compose -f docker-compose.prod.yml -f docker-compose.server-build.yml build frontend
            docker compose -f docker-compose.prod.yml -f docker-compose.server-build.yml up -d --no-deps frontend

            # 古いイメージを削除
            docker image prune -f
